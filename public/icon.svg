<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  <!-- Inner subtle border glow -->
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <!-- Tag / Shield / Gem Symbol -->
  <g transform="translate(116, 116) scale(0.55)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond Price Tag & Scanner Spark -->
    <path d="M200 40 L440 280 L280 440 L40 200 L40 40 Z" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="28"/>
    <circle cx="130" cy="130" r="32" fill="#ffffff"/>
    <path d="M240 200 L320 280" stroke="#ffffff" stroke-width="24"/>
    <path d="M200 240 L280 320" stroke="#ffffff" stroke-width="24"/>
    <!-- Trending Arrow -->
    <path d="M340 100 L440 100 L440 200" stroke="#34d399" stroke-width="32"/>
    <path d="M220 320 L430 110" stroke="#34d399" stroke-width="32"/>
  </g>
</svg>
